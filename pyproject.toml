[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-math-assistant-langchain"
version = "1.0.0"
description = "AI math assistant agent built with LangChain 1.x tool calling (@tool + create_agent) — 5 math tools, multi-step tool chaining, OpenAI / IBM watsonx / offline modes, CLI with trace view. 59 offline tests + live LLM evals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VictorV" }]
keywords = ["langchain", "langgraph", "ai-agents", "tool-calling", "function-calling", "agentic-ai", "llm", "openai", "watsonx", "ibm-granite", "python", "pytest", "llm-evaluation", "jupyter-notebook", "cli", "coursera", "portfolio-project"]
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
watsonx = ["langchain-ibm>=1.0"]
wiki = ["langchain-community>=0.4", "wikipedia>=1.4"]
dev = ["pytest>=8", "pytest-cov>=5", "nbclient>=0.10", "ipykernel>=6"]
all = ["ai-math-assistant-langchain[openai,watsonx,wiki,dev]"]

[project.scripts]
math-assistant = "math_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls a real LLM API (needs OPENAI_API_KEY); skipped otherwise"]
