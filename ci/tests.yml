name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Offline tests (no API keys needed)
        run: pytest -m "not live" -v --cov=math_assistant --cov-report=term-missing

  live:
    # Runs only when the OPENAI_API_KEY repository secret is configured
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,openai]"
      - name: Live LLM evaluation (skipped without the secret)
        run: pytest -m live -v
